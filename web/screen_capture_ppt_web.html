<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屏幕变化自动截屏 → PPT（网页版）</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #777; font-size: 13px; margin-bottom: 14px; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-green { background: #2ecc71; color: #fff; }
  .btn-blue  { background: #3498db; color: #fff; }
  .btn-amber { background: #f39c12; color: #fff; }
  .btn-red   { background: #e74c3c; color: #fff; }
  .btn-teal  { background: #1abc9c; color: #fff; }
  .preview { position: relative; background: #000; border-radius: 8px; overflow: hidden; min-height: 180px; }
  #preview { width: 100%; display: block; }
  .pvhint { position: absolute; top: 8px; left: 12px; color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .bbox { position: absolute; border: 2px dashed #2ecc71; pointer-events: none; display: none; }
  .field label { font-size: 13px; color: #555; display:block; margin-bottom: 2px; }
  input[type=range] { width: 180px; vertical-align: middle; }
  .stat b { font-size: 20px; margin-right: 12px; }
  .stat{ font-size: 13px; color:#555;}
  .gray{color:#999;font-size:12px;}
  label.ck{font-size:13px;color:#555;display:flex;align-items:center;gap:4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>屏幕变化自动截屏 → PPT（网页版）</h1>
  <div class="sub">点击“选择屏幕/窗口”分享要监测的画面，可框选检测区域；检测到区域变化自动截图并去重，最后下载为 PPT。全程在本机浏览器完成，无上传。</div>

  <div class="card">
    <button class="btn-green" id="btnShare">① 选择屏幕 / 窗口</button>
    <button class="btn-blue" id="btnRegion" disabled>② 框选检测区域</button>
    <button class="btn-teal" id="btnClearRegion" disabled>重置为全屏</button>
    <button class="btn-blue" id="btnStart" disabled>▶ 开始检测</button>
    <button class="btn-amber" id="btnPause" disabled>⏸ 暂停</button>
    <button class="btn-red" id="btnStop" disabled>■ 停止</button>
    <button class="btn-teal" id="btnDownload" disabled>⬇ 下载 PPT</button>
    <label class="ck"><input type="checkbox" id="ckAuto">停止时自动下载PPT</label>
  </div>

  <div class="card">
    <div class="preview">
      <canvas id="preview" width="960" height="540"></canvas>
      <div class="bbox" id="bbox"></div>
      <div class="pvhint" id="pvhint">尚未选择屏幕</div>
    </div>
    <div class="row" id="regionEdit" style="margin-top:8px;display:none;">
      <div class="field"><label>X</label><input type="number" id="regX" min="0" step="1" style="width:70px"></div>
      <div class="field"><label>Y</label><input type="number" id="regY" min="0" step="1" style="width:70px"></div>
      <div class="field"><label>宽</label><input type="number" id="regW" min="8" step="1" style="width:70px"></div>
      <div class="field"><label>高</label><input type="number" id="regH" min="8" step="1" style="width:70px"></div>
      <button class="btn-blue" id="btnApplyRegion" style="align-self:flex-end">应用</button>
      <span class="gray">可拖动画框移动，或拖四角/四边调整大小；也可直接改数值微调。</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field"><label>采样间隔(秒)</label><input type="range" id="interval" min="0.2" max="2" step="0.1" value="0.5"><span id="v_interval">0.5</span></div>
      <div class="field"><label>变化阈值</label><input type="range" id="cth" min="1" max="30" step="0.5" value="5"><span id="v_cth">5</span></div>
      <div class="field"><label>去重阈值(越小越严格)</label><input type="range" id="dth" min="0.5" max="10" step="0.5" value="2.5"><span id="v_dth">2.5</span></div>
    </div>
    <div class="gray">变化阈值=画面相对上一帧的差异度；去重阈值=新画面相对“已保存每一页”的相似判定，低于该值视为相同并自动跳过（删除重复页）。</div>
  </div>

  <div class="card stat">
    状态：<b id="state" style="color:#555">空闲</b>
    已捕获：<b id="cnt">0</b> 张
    去重跳过：<b id="dup">0</b> 张
    已保存页数：<b id="pages">0</b> 页
  </div>
  <div class="gray" id="log"></div>
</div>

<script>window.USAGE_HTML="<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>\u5c4f\u5e55\u53d8\u5316\u622a\u5c4fPPT\u5de5\u5177 \u00b7 \u4f7f\u7528\u8bf4\u660e</title><style>\nbody{margin:0;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#1f2937;background:#f5f7fa;line-height:1.7}\n.wrap{max-width:820px;margin:0 auto;padding:32px 20px}\n.card{background:#fff;border-radius:12px;padding:32px 40px;box-shadow:0 1px 6px rgba(0,0,0,.08)}\nh1{font-size:26px;border-bottom:3px solid #2563eb;padding-bottom:12px}\nh2{font-size:21px;border-left:5px solid #2563eb;padding-left:10px;margin-top:34px}\nh3{font-size:17px;color:#2563eb}\ntable{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}\nth,td{border:1px solid #d1d5db;padding:8px 12px;text-align:left}\nth{background:#eff6ff}\ncode{background:#eef2ff;padding:2px 6px;border-radius:4px}\nblockquote{border-left:4px solid #f59e0b;background:#fffbeb;padding:10px 16px;margin:14px 0}\nhr{border:none;border-top:1px solid #e5e7eb;margin:24px 0}\n.foot{color:#9ca3af;font-size:12px;text-align:center;margin-top:22px}\n</style></head><body><div class='wrap'><div class='card'><h1>\u5c4f\u5e55\u53d8\u5316\u622a\u5c4f PPT \u5de5\u5177 \u2014\u2014 \u4f7f\u7528\u8bf4\u660e\u6587\u6863</h1>\n<blockquote>\n<p>\u672c\u5de5\u5177\u7528\u4e8e<strong>\u6301\u7eed\u76d1\u63a7\u7535\u8111\u5c4f\u5e55\u6307\u5b9a\u533a\u57df</strong>\uff0c\u5f53\u8be5\u533a\u57df\u753b\u9762\u53d1\u751f\u53d8\u5316\u65f6<strong>\u81ea\u52a8\u622a\u56fe</strong>\uff0c\u5e76\u5c06\u6bcf\u4e00\u5f20\u622a\u56fe\u4f5c\u4e3a\u5355\u72ec\u7684\u4e00\u9875\u4fdd\u5b58\u5230 PowerPoint\uff08<code>.pptx</code>\uff09\u6587\u4ef6\u4e2d\uff0c\u540c\u65f6<strong>\u81ea\u52a8\u53bb\u9664\u91cd\u590d\u753b\u9762</strong>\uff0c\u5e2e\u52a9\u4f60\u628a\u5c4f\u5e55\u64cd\u4f5c\u7684\u6bcf\u4e2a\u5173\u952e\u6b65\u9aa4\u6c89\u6dc0\u6210\u53ef\u7ffb\u9605\u3001\u53ef\u5206\u4eab\u7684\u6f14\u793a\u6587\u7a3f\u3002</p>\n</blockquote>\n<hr />\n<h2>\u4e00\u3001\u4e24\u79cd\u4f7f\u7528\u65b9\u5f0f</h2>\n<p>\u672c\u5de5\u5177\u63d0\u4f9b\u4e24\u79cd\u5f62\u6001\uff0c\u63a8\u8350\u4f7f\u7528 <strong>\u2460 \u7f51\u9875\u7248</strong>\uff1a</p>\n<table>\n<thead>\n<tr>\n<th>\u65b9\u5f0f</th>\n<th>\u662f\u5426\u9700\u8981\u5b89\u88c5</th>\n<th>\u662f\u5426\u9700\u8981\u7f51\u7edc</th>\n<th>\u7cfb\u7edf</th>\n<th>\u63a8\u8350\u5ea6</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u2460 \u7f51\u9875\u7248\uff08\u6d4f\u89c8\u5668\u6253\u5f00\u5373\u53ef\u7528\uff09</td>\n<td>\u4e0d\u9700\u8981</td>\n<td>\u9996\u6b21\u9700\u8054\u7f51\u52a0\u8f7d\u7ec4\u4ef6</td>\n<td>Windows / Mac / Linux \u5747\u53ef\u7528</td>\n<td>\u2b50 \u63a8\u8350</td>\n</tr>\n<tr>\n<td>\u2461 \u684c\u9762 .exe \u7248\uff08Windows\uff09</td>\n<td>\u9700\u8981\u6253\u5305</td>\n<td>\u4e0d\u9700\u8981</td>\n<td>\u4ec5 Windows</td>\n<td>\u53ef\u9009</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>\u4e8c\u3001\u2460 \u7f51\u9875\u7248\uff08\u63a8\u8350\uff09</h2>\n<h3>2.1 \u6253\u5f00\u65b9\u5f0f</h3>\n<ol>\n<li>\u7528 <strong>Chrome \u6216 Edge</strong>\uff08\u8981\u6c42\u8f83\u65b0\u7248\u672c\uff09\u6253\u5f00\u7f51\u9875\u7248\u7684 <code>.html</code> \u6587\u4ef6\u3002</li>\n<li>\u6d4f\u89c8\u5668\u4f1a\u63d0\u793a\u9009\u62e9\u8981\u5171\u4eab\u7684\u5185\u5bb9\uff0c\u70b9\u51fb\u201c\u9009\u62e9\u5c4f\u5e55 / \u7a97\u53e3\u201d\u6309\u94ae\u540e\uff0c<strong>\u9009\u62e9\u9700\u8981\u76d1\u63a7\u7684\u6574\u4e2a\u5c4f\u5e55\u6216\u67d0\u4e2a\u7a97\u53e3</strong>\uff0c\u70b9\u51fb\u201c\u5206\u4eab\u201d\u3002</li>\n<li>\u7cfb\u7edf\u5f39\u51fa\u201c\u9009\u62e9\u68c0\u6d4b\u533a\u57df\u201d\u63d0\u793a\u540e\uff0c<strong>\u7528\u9f20\u6807\u5728\u9884\u89c8\u753b\u9762\u4e0a\u62d6\u62fd\u6846\u51fa\u8981\u76d1\u63a7\u7684\u533a\u57df</strong>\uff08\u677e\u5f00\u9f20\u6807\u540e\u533a\u57df\u53ef\u7ee7\u7eed\u8c03\u6574\uff0c\u89c1 2.3\uff09\uff0c\u70b9\u51fb\u201c\u2461 \u6846\u9009\u68c0\u6d4b\u533a\u57df\u201d\u786e\u8ba4\u3002</li>\n</ol>\n<h3>2.2 \u9875\u9762\u6309\u94ae\u8bf4\u660e</h3>\n<table>\n<thead>\n<tr>\n<th>\u6309\u94ae</th>\n<th>\u529f\u80fd</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u2460 \u9009\u62e9\u5c4f\u5e55/\u7a97\u53e3</td>\n<td>\u9009\u62e9\u8981\u76d1\u63a7\u7684\u5c4f\u5e55\u6216\u5e94\u7528\u7a97\u53e3</td>\n</tr>\n<tr>\n<td>\u2461 \u6846\u9009\u68c0\u6d4b\u533a\u57df</td>\n<td>\u5728\u753b\u9762\u4e2d\u6846\u5b9a\u9700\u8981\u68c0\u6d4b\u53d8\u5316\u7684\u533a\u57df</td>\n</tr>\n<tr>\n<td>\u91cd\u7f6e\u4e3a\u5168\u5c4f</td>\n<td>\u5c06\u68c0\u6d4b\u533a\u57df\u6062\u590d\u4e3a\u6574\u4e2a\u5c4f\u5e55</td>\n</tr>\n<tr>\n<td>\u25b6 \u5f00\u59cb\u68c0\u6d4b</td>\n<td>\u5f00\u59cb\u6309\u56fa\u5b9a\u95f4\u9694\u91c7\u6837\u5e76\u622a\u56fe</td>\n</tr>\n<tr>\n<td>\u23f8 \u6682\u505c / \u25b6 \u7ee7\u7eed</td>\n<td>\u4e34\u65f6\u6682\u505c\u6216\u6062\u590d\u622a\u56fe\uff08\u753b\u9762\u53d1\u751f\u53d8\u5316\u4e0d\u4e22\u5931\uff09</td>\n</tr>\n<tr>\n<td>\u25a0 \u505c\u6b62</td>\n<td>\u7ed3\u675f\u672c\u8f6e\u68c0\u6d4b</td>\n</tr>\n<tr>\n<td>\u2b07 \u4e0b\u8f7d PPT</td>\n<td>\u628a\u5df2\u4fdd\u5b58\u7684\u622a\u56fe\u5bfc\u51fa\u4e3a <code>.pptx</code> \u6587\u4ef6</td>\n</tr>\n<tr>\n<td>\u505c\u6b62\u65f6\u81ea\u52a8\u4e0b\u8f7d PPT</td>\n<td>\u52fe\u9009\u540e\uff0c\u70b9\u51fb\u201c\u505c\u6b62\u201d\u4f1a\u81ea\u52a8\u4e0b\u8f7d PPT</td>\n</tr>\n</tbody>\n</table>\n<h3>2.3 \u6846\u9009\u533a\u57df\u7684\u8c03\u6574</h3>\n<ul>\n<li>\u6846\u9009\u5b8c\u6210\u540e\uff0c\u677e\u5f00\u9f20\u6807\uff0c\u753b\u9762\u4f1a\u663e\u793a\u4e00\u4e2a<strong>\u865a\u7ebf\u6846</strong>\uff1b\u6b64\u65f6<strong>\u53ef\u62d6\u62fd\u865a\u7ebf\u6846\u56db\u89d2/\u8fb9\u7f18</strong>\u8fdb\u884c\u653e\u5927\u3001\u7f29\u5c0f\uff0c\u6216\u6309\u4f4f\u6846\u5185\u62d6\u52a8\u6574\u4f53\u79fb\u52a8\u4f4d\u7f6e\u3002</li>\n<li>\u4e5f\u53ef\u4ee5\u76f4\u63a5\u5728\u4e0b\u65b9 <code>X / Y / \u5bbd / \u9ad8</code> \u56db\u4e2a\u8f93\u5165\u6846\u4e2d\u8f93\u5165\u7cbe\u786e\u6570\u503c\uff0c\u70b9\u51fb <strong>\u5e94\u7528</strong> \u786e\u8ba4\uff0c\u5b9e\u73b0\u7cbe\u51c6\u5b9a\u4f4d\u3002</li>\n</ul>\n<h3>2.4 \u4e09\u4e2a\u5173\u952e\u53c2\u6570</h3>\n<table>\n<thead>\n<tr>\n<th>\u53c2\u6570</th>\n<th>\u9ed8\u8ba4\u503c</th>\n<th>\u4f5c\u7528</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\u91c7\u6837\u95f4\u9694(\u79d2)</td>\n<td>0.5</td>\n<td>\u6bcf\u6b21\u68c0\u6d4b\u753b\u9762\u7684\u65f6\u95f4\u95f4\u9694\uff0c\u6570\u503c\u8d8a\u5c0f\u8d8a\u7075\u654f\u3001\u622a\u56fe\u8d8a\u9891\u7e41</td>\n</tr>\n<tr>\n<td>\u53d8\u5316\u9608\u503c</td>\n<td>5</td>\n<td>\u4e0e\u4e0a\u4e00\u5e27\u753b\u9762\u7684\u5dee\u5f02\u5ea6\uff0c\u8d85\u8fc7\u8be5\u503c\u624d\u89c6\u4e3a\u201c\u53d1\u751f\u4e86\u53d8\u5316\u201d\uff0c\u8fdb\u884c\u622a\u56fe</td>\n</tr>\n<tr>\n<td>\u53bb\u91cd\u9608\u503c</td>\n<td>2.5</td>\n<td>\u65b0\u753b\u9762\u4e0e<strong>\u5df2\u4fdd\u5b58\u7684\u6bcf\u4e00\u9875</strong>\u8fdb\u884c\u76f8\u4f3c\u5ea6\u6bd4\u5bf9\uff0c\u4f4e\u4e8e\u8be5\u503c\u89c6\u4e3a\u201c\u91cd\u590d\u753b\u9762\u201d\uff0c\u81ea\u52a8\u8df3\u8fc7\uff0c\u907f\u514d\u5185\u5bb9\u91cd\u590d</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>\u63d0\u793a</strong>\uff1a\u628a\u9f20\u6807\u653e\u5728\u6ed1\u6761\u4e0a\u5de6\u53f3\u62d6\u52a8\uff0c\u53f3\u4fa7\u6570\u503c\u4f1a\u201c\u5b9e\u65f6\u53d8\u5316\u201d\u5e76\u751f\u6548\uff1b\u4fee\u6539\u91c7\u6837\u95f4\u9694\u540e\uff0c\u6b63\u5728\u8fd0\u884c\u7684\u68c0\u6d4b\u4e5f\u4f1a\u7acb\u5373\u6309\u65b0\u95f4\u9694\u91c7\u6837\u3002</p>\n</blockquote>\n<h3>2.5 \u8bf4\u660e</h3>\n<ul>\n<li>\u72b6\u6001\u680f\u4f1a\u5b9e\u65f6\u663e\u793a<strong>\u72b6\u6001\u3001\u5df2\u6355\u83b7\u5f20\u6570\u3001\u53bb\u91cd\u8df3\u8fc7\u5f20\u6570\u3001\u5df2\u4fdd\u5b58\u9875\u6570</strong>\u3002</li>\n<li>\u7531\u4e8e\u53bb\u91cd\u662f\u201c\u8de8\u6240\u6709\u5df2\u4fdd\u5b58\u9875\u201d\u8fdb\u884c\u7684\uff0c\u53ea\u8981\u753b\u9762\u4e0a\u51fa\u73b0\u8fc7\u7684\u5185\u5bb9\uff0c\u5373\u4f7f\u77ed\u6682\u6d88\u5931\u53c8\u91cd\u73b0\uff0c\u4e5f\u4f1a\u88ab\u8bc6\u522b\u4e3a\u91cd\u590d\u800c\u81ea\u52a8\u5ffd\u7565\uff0c\u4ece\u800c\u53ea\u4fdd\u7559\u771f\u6b63\u7684\u65b0\u5185\u5bb9\u3002</li>\n<li>\u5bfc\u51fa\u7684 PPT \u4e3a\u6807\u51c6 16:9 \u5bbd\u5c4f\u5e7b\u706f\u7247\uff0c\u6bcf\u5f20\u622a\u56fe\u90fd\u4f1a<strong>\u7b49\u6bd4\u7f29\u653e\u3001\u5c45\u4e2d\u3001\u5b8c\u6574\u653e\u5165</strong>\u4e00\u9875\u5de5\u4f5c\u533a\uff0c\u4e0d\u4f1a\u6ea2\u51fa\u4e5f\u4e0d\u4f1a\u53d8\u5f62\u3002</li>\n</ul>\n<hr />\n<h2>\u4e09\u3001\u2461 \u684c\u9762 .exe \u7248\uff08Windows\uff0c\u53ef\u9009\uff09</h2>\n<blockquote>\n<p>\u684c\u9762\u7248\u9700\u5148\u5728\u4f60\u7684 Windows \u7535\u8111\u4e0a<strong>\u5b8c\u6210\u4e00\u6b21\u6253\u5305</strong>\u751f\u6210 <code>.exe</code>\uff0c\u4e4b\u540e\u65e0\u9700\u518d\u88c5 Python\u3002</p>\n</blockquote>\n<h3>3.1 \u6253\u5305\u524d\u7f6e\u6761\u4ef6</h3>\n<ul>\n<li>\u4e00\u53f0 <strong>Windows \u7535\u8111</strong>\uff08\u7f51\u9875\u7248\u652f\u6301\u4efb\u610f\u7cfb\u7edf\uff0c\u4f46 <code>.exe</code> \u53ea\u80fd\u5728 Windows \u4e0a\u751f\u6210\uff09\u3002</li>\n<li>\u5df2\u7ecf\u5b89\u88c5 <strong>Python 3.8 \u53ca\u4ee5\u4e0a</strong>\uff0c\u4e14\u6709\u6b63\u5e38\u7684 <code>pip</code>\uff08\u82e5\u7528\u7cfb\u7edf\u81ea\u5e26\u65e0 pip \u7684 Python\uff0c\u5efa\u8bae\u5148\u5b89\u88c5\u5b98\u65b9 Python \u5e76\u52fe\u9009\u201cAdd to PATH\u201d\uff09\u3002</li>\n</ul>\n<h3>3.2 \u4e00\u952e\u6253\u5305</h3>\n<ol>\n<li>\u5c06\u9879\u76ee\u538b\u7f29\u5305\u89e3\u538b\u5230\u67d0\u76ee\u5f55\u3002</li>\n<li>\u53cc\u51fb\u9879\u76ee\u6839\u76ee\u5f55\u4e0b\u7684 <strong><code>build_exe.bat</code></strong>\u3002</li>\n<li>\u811a\u672c\u4f1a\u81ea\u52a8\uff1a</li>\n<li>\u5b89\u88c5\u4f9d\u8d56\uff08<code>mss</code>\u3001<code>opencv-python</code>\u3001<code>python-pptx</code>\u3001<code>pillow</code>\u3001<code>pyinstaller</code> \u7b49\uff09\uff1b</li>\n<li>\u8c03\u7528 PyInstaller \u6253\u5305\u4e3a\u5355\u6587\u4ef6\u684c\u9762\u7a0b\u5e8f\uff1b</li>\n<li>\u6253\u5305\u5b8c\u6210\u540e\uff0c<strong>\u751f\u6210\u7684 <code>.exe</code> \u4f4d\u4e8e\u9879\u76ee\u6839\u76ee\u5f55\u4e0b\u7684 <code>dist\\ScreenCapturePPT.exe</code></strong>\u3002</li>\n<li>\u53cc\u51fb <code>dist\\ScreenCapturePPT.exe</code> \u5373\u53ef\u4f7f\u7528\uff0c\u4e4b\u540e\u53ef\u628a\u8be5 <code>.exe</code> \u590d\u5236\u5230\u5176\u4ed6 Windows \u7535\u8111\u5355\u72ec\u8fd0\u884c\uff08\u514d\u5b89\u88c5 Python\uff09\u3002</li>\n</ol>\n<h3>3.3 \u684c\u9762\u7248\u754c\u9762\u64cd\u4f5c\uff08\u57fa\u672c\u4e0e\u7f51\u9875\u7248\u4e00\u81f4\uff09</h3>\n<ul>\n<li>\u8fd0\u884c\u540e\u4f1a\u81ea\u52a8\u521b\u5efa\u4e00\u4e2a\u672c\u5730\u7684 <code>.pptx</code> \u6587\u4ef6\u7528\u4e8e\u4fdd\u5b58\u622a\u56fe\u3002</li>\n<li>\u5728\u9884\u89c8\u7a97\u53e3\u4e0a\u7528\u9f20\u6807\u6846\u5b9a\u68c0\u6d4b\u533a\u57df\uff08\u53ef\u62d6\u52a8\u8c03\u6574\u5927\u5c0f\uff09\u3002</li>\n<li>\u901a\u8fc7 <strong>\u5f00\u59cb / \u6682\u505c / \u7ee7\u7eed / \u505c\u6b62</strong> \u6309\u94ae\u63a7\u5236\u622a\u56fe\u6d41\u7a0b\u3002</li>\n<li>\u4e0d\u540c\u5e27\u753b\u9762\u6309\u201c\u53d8\u5316\u9608\u503c\u201d\u5224\u65ad\u662f\u5426\u66f4\u65b0\uff0c\u6309\u201c\u53bb\u91cd\u9608\u503c\u201d\u4e0e\u5df2\u7ecf\u4fdd\u5b58\u7684\u6240\u6709\u9875\u6bd4\u8f83\uff0c\u91cd\u590d\u5185\u5bb9\u81ea\u52a8\u8df3\u8fc7\u3002</li>\n<li>\u505c\u6b62\u540e\uff0c\u672c\u5730 PPT \u6587\u4ef6\u5373\u4e3a\u6700\u7ec8\u6210\u679c\uff0c\u53ef\u76f4\u63a5\u6253\u5f00\u67e5\u770b\u3002</li>\n</ul>\n<hr />\n<h2>\u56db\u3001\u5e38\u89c1\u95ee\u9898\uff08FAQ\uff09</h2>\n<p><strong>Q1\uff1a\u7f51\u9875\u7248\u6253\u5f00\u540e\u70b9\u201c\u9009\u62e9\u5c4f\u5e55\u201d\u6ca1\u53cd\u5e94\uff1f</strong><br />\n\u8bf7\u4f7f\u7528\u6700\u65b0\u7248 Chrome \u6216 Edge\uff1b\u8be5\u529f\u80fd\u4f9d\u8d56\u6d4f\u89c8\u5668\u7684\u5c4f\u5e55\u5171\u4eab\u80fd\u529b\uff0c\u65e7\u7248\u6d4f\u89c8\u5668\u53ef\u80fd\u4e0d\u652f\u6301\u3002</p>\n<p><strong>Q2\uff1a\u4e3a\u4ec0\u4e48\u6709\u4e9b\u9875\u9762\u6ca1\u6709\u88ab\u4fdd\u5b58\uff1f</strong><br />\n\u5982\u679c\u4e24\u5e27\u753b\u9762\u51e0\u4e4e\u4e00\u6837\uff08\u5dee\u5f02\u4f4e\u4e8e\u201c\u53bb\u91cd\u9608\u503c\u201d\uff09\uff0c\u4f1a\u88ab\u5224\u65ad\u4e3a\u91cd\u590d\u5185\u5bb9\u800c\u81ea\u52a8\u8df3\u8fc7\uff0c\u8fd9\u662f\u4e3a\u4e86\u53bb\u9664\u91cd\u590d\u9875\u9762\u7684\u6b63\u5e38\u8868\u73b0\u3002\u9700\u8981\u66f4\u7075\u654f\u65f6\uff0c\u53ef\u8c03\u5c0f\u201c\u53bb\u91cd\u9608\u503c\u201d\u6216\u201c\u53d8\u5316\u9608\u503c\u201d\u3002</p>\n<p><strong>Q3\uff1a\u622a\u51fa\u6765\u7684\u56fe\u5728 PPT \u91cc\u5468\u56f4\u6709\u767d\u8fb9\uff1f</strong><br />\n\u56e0\u4e3a\u6bcf\u5f20\u56fe\u4f1a\u6309 16:9 \u5de5\u4f5c\u533a<strong>\u7b49\u6bd4\u7f29\u653e</strong>\uff08\u4fdd\u6301\u6bd4\u4f8b\u4e0d\u53d8\u5f62\uff09\u3002\u5982\u679c\u76d1\u63a7\u533a\u57df\u4e0d\u662f\u6807\u51c6\u7684 16:9\uff0c\u7b49\u6bd4\u540e\u56db\u5468\u4f1a\u6709\u5c11\u91cf\u7559\u767d\uff0c\u5c5e\u6b63\u5e38\u73b0\u8c61\u3002</p>\n<p><strong>Q4\uff1a\u751f\u6210\u7684 <code>.exe</code> \u5728\u54ea\u91cc\uff1f</strong><br />\n\u5728\u9879\u76ee\u6839\u76ee\u5f55\u7684 <code>dist\\</code> \u6587\u4ef6\u5939\u91cc\uff0c\u6587\u4ef6\u540d\u56fa\u5b9a\u4e3a <code>ScreenCapturePPT.exe</code>\u3002</p>\n<p><strong>Q5\uff1a\u684c\u9762\u7248\u6253\u5305\u65f6\u62a5 <code>No module named PyInstaller</code>\uff1f</strong><br />\n\u8bf4\u660e\u5f53\u524d Python \u6ca1\u6709\u6253\u5305\u5de5\u5177\u3002\u628a <code>build_exe.bat</code> \u7528\u201c\u8bb0\u4e8b\u672c\u201d\u6253\u5f00\u540e\uff0c\u76f4\u63a5\u53f3\u952e\u201c\u4ee5\u7ba1\u7406\u5458\u8eab\u4efd\u8fd0\u884c\u201d\u53ef\u81ea\u52a8\u5b89\u88c5\uff1b\u82e5\u4ecd\u5931\u8d25\uff0c\u8bf4\u660e\u8be5\u7cfb\u7edf Python \u7f3a <code>pip</code>\uff0c\u8bf7\u5b89\u88c5\u5b98\u65b9 Python \u540e\u91cd\u8bd5\u3002</p>\n<hr />\n<h2>\u4e94\u3001\   let captureCount=0, dupCount=0;

  const $=id=>document.getElementById(id);
  const btnShare=$('btnShare'), btnRegion=$('btnRegion'), btnClear=$('btnClearRegion'),
        btnStart=$('btnStart'), btnPause=$('btnPause'), btnStop=$('btnStop'), btnDown=$('btnDownload');

  function ui(){
    $('state').textContent = !stream ? '空闲' : (running ? (paused?'已暂停':'检测中') : '已就绪');
    $('cnt').textContent = captureCount;
    $('dup').textContent = dupCount;
    $('pages').textContent = savedImages.length;
    $('v_interval').textContent = $('interval').value;
    $('v_cth').textContent = $('cth').value;
    $('v_dth').textContent = $('dth').value;
  }
  function log(t){ $('log').textContent = t; }

  // 滑条拖动时实时刷新显示数值；采样间隔变动且正在检测时立即重设采样定时器
  function bindSlider(id, labelId){
    const el=$(id), lb=$(labelId);
    el.addEventListener('input', ()=>{
      lb.textContent = el.value;
      if(id==='interval' && running && !paused && timer){
        clearInterval(timer);
        timer=setInterval(tick, parseFloat(el.value)*1000);
      }
    });
  }
  bindSlider('interval','v_interval');
  bindSlider('cth','v_cth');
  bindSlider('dth','v_dth');

  // ---------- 1. 选择屏幕 ----------
  btnShare.onclick = async ()=>{
    try{
      stream = await navigator.mediaDevices.getDisplayMedia({ video:{frameRate:30}, audio:false });
    }catch(e){ log('已取消或无法获取屏幕: '+e.message); return; }
    video.srcObject = stream;
    await new Promise(res=>video.onloadedmetadata=()=>res());
    video.play();
    region=null; btnRegion.disabled=false; btnClear.disabled=false; btnStart.disabled=false; btnDown.disabled=false;
    $('pvhint').textContent = '已分享：'+video.videoWidth+'x'+video.videoHeight+'（可用“框选检测区域”圈出局部）';
    // 监听分享栏停止
    stream.getVideoTracks()[0].addEventListener('ended', ()=>{ if(!running) resetAll(); });
    fitPreview();
    drawLoop();
    ui();
  };

  // ---------- 预览（等比缩放绘制 + 区域框） ----------
  function fitPreview(){
    const vw=video.videoWidth||960, vh=video.videoHeight||540;
    const cw=pv.clientWidth||pv.width, ch=cw*vh/vw;
    pv.width=cw; pv.style.height=ch+'px'; pv.height=ch;
  }
  function scaleXY(){ const vw=video.videoWidth||1, vh=video.videoHeight||1; return {sx:pv.width/vw, sy:pv.height/vh}; }
  function drawDashRect(x0,y0,x1,y1){
    // 在预览画布上以预览像素坐标绘制虚线框（含半透明填充，便于看清范围）
    pctx.save();
    pctx.fillStyle='rgba(46,204,113,0.14)';
    pctx.fillRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0));
    pctx.setLineDash([7,5]);
    pctx.strokeStyle='#2ecc71'; pctx.lineWidth=2;
    pctx.strokeRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0));
    pctx.setLineDash([]);
    pctx.restore();
  }
  function drawLoop(){ // 持续把分享画面画到预览
    requestAnimationFrame(()=>{
      if(!stream){
        pctx.fillStyle='#111'; pctx.fillRect(0,0,pv.width,pv.height);
        return requestAnimationFrame(drawLoop);
      }
      pctx.drawImage(video,0,0,pv.width,pv.height);
      // 框选进行中：实时绘制虚线框，随时看清正在框的位置
      if(sel && sel.active){
        drawDashRect(sel.x0, sel.y0, sel.x1, sel.y1);
      }
      // 已确认区域：绘制虚线框（若取了子区域）并画出可拖拽的控制点
      if(region){
        const s=scaleXY(); const r=region;
        drawDashRect(r.x*s.sx, r.y*s.sy, (r.x+r.w)*s.sx, (r.y+r.h)*s.sy);
        bbox.style.display='block';
        bbox.style.left=(r.x*s.sx)+'px'; bbox.style.top=(r.y*s.sy)+'px';
        bbox.style.width=(r.w*s.sx)+'px'; bbox.style.height=(r.h*s.sy)+'px';
        // 控制点（8个）：四角+四边中点
        const cx=(r.x+r.w/2)*s.sx, cy=(r.y+r.h/2)*s.sy;
        const L=r.x*s.sx, T=r.y*s.sy, R=(r.x+r.w)*s.sx, B=(r.y+r.h)*s.sy;
        const pts=[[L,T],[cx,T],[R,T],[R,cy],[R,B],[cx,B],[L,B],[L,cy]];
        pctx.fillStyle='#fff'; pctx.strokeStyle='#2ecc71'; pctx.lineWidth=2;
        for(const [hx,hy] of pts){
          pctx.beginPath(); pctx.rect(hx-4, hy-4, 8, 8); pctx.fill(); pctx.stroke();
        }
      } else { bbox.style.display='none'; }
      requestAnimationFrame(drawLoop);
    });
  }

  // ---------- 2. 框选与编辑检测区域 ----------
  let sel=null;            // 正在拖拽新框 {x0,y0,x1,y1,active}
  let selectArmed=false;   // 点“框选检测区域”后进入“画新框”状态
  let edit={active:false,type:'move',handle:null,startX:0,startY:0,orig:null}; // 调整已确认区域

  function toPrev(e){ const rc=pv.getBoundingClientRect(); return {x:e.clientX-rc.left, y:e.clientY-rc.top}; }
  function srcW(){ return video.videoWidth||1; }
  function srcH(){ return video.videoHeight||1; }

  // 判断鼠标是否命中区域框(四角/四边中点/内部)，返回 handle 名或 'move' 或 null
  function hitHandle(p){
    if(!region) return null;
    const s=scaleXY(), tol=12;
    const L=region.x*s.sx, T=region.y*s.sy, R=(region.x+region.w)*s.sx, B=(region.y+region.h)*s.sy;
    const onL=Math.abs(p.x-L)<=tol, onR=Math.abs(p.x-R)<=tol;
    const onT=Math.abs(p.y-T)<=tol, onB=Math.abs(p.y-B)<=tol;
    if(onL&&onT) return 'nw'; if(onR&&onT) return 'ne';
    if(onL&&onB) return 'sw'; if(onR&&onB) return 'se';
    if(onL) return 'w'; if(onR) return 'e'; if(onT) return 'n'; if(onB) return 's';
    if(p.x>=L&&p.x<=R&&p.y>=T&&p.y<=B) return 'move';
    return null;
  }
  function pointerDown(e){
    const p=toPrev(e);
    if(selectArmed){ // 画新框
      selectArmed=false;
      sel={x0:p.x,y0:p.y,x1:p.x,y1:p.y,active:true};
      return;
    }
    if(region){
      const h=hitHandle(p);
      if(h){
        edit.active=true; edit.type=(h==='move')?'move':'resize'; edit.handle=h;
        edit.startX=p.x; edit.startY=p.y;
        edit.orig={x:region.x,y:region.y,w:region.w,h:region.h};
      }
    }
  }
  function pointerMove(e){
    const p=toPrev(e);
    if(sel && sel.active){ sel.x1=p.x; sel.y1=p.y; return; }
    if(edit.active && edit.orig){
      const s=scaleXY();
      if(edit.type==='move'){
        let nx=edit.orig.x+(p.x-edit.startX)/s.sx, ny=edit.orig.y+(p.y-edit.startY)/s.sy;
        nx=Math.max(0, Math.min(srcW()-edit.orig.w, nx));
        ny=Math.max(0, Math.min(srcH()-edit.orig.h, ny));
        region.x=Math.round(nx); region.y=Math.round(ny);
      }else{
        let L=edit.orig.x,T=edit.orig.y,R=edit.orig.x+edit.orig.w,B=edit.orig.y+edit.orig.h;
        const px=p.x/s.sx, py=p.y/s.sy;
        if(edit.handle.indexOf('e')>=0) R=px;
        if(edit.handle.indexOf('w')>=0) L=px;
        if(edit.handle.indexOf('s')>=0) B=py;
        if(edit.handle.indexOf('n')>=0) T=py;
        if(R-L<8){ if(edit.handle.indexOf('w')>=0) L=R-8; else R=L+8; }
        if(B-T<8){ if(edit.handle.indexOf('n')>=0) T=B-8; else B=T+8; }
        L=Math.max(0,L); T=Math.max(0,T); R=Math.min(srcW(),R); B=Math.min(srcH(),B);
        region.x=Math.round(L); region.y=Math.round(T); region.w=Math.round(R-L); region.h=Math.round(B-T);
      }
      updateRegionInputs();
    }
  }
  function pointerUp(){
    if(sel && sel.active){
      sel.active=false;
      const s=scaleXY();
      const X0=Math.min(sel.x0,sel.x1)/s.sx, X1=Math.max(sel.x0,sel.x1)/s.sx;
      const Y0=Math.min(sel.y0,sel.y1)/s.sy, Y1=Math.max(sel.y0,sel.y1)/s.sy;
      const w=X1-X0, h=Y1-Y0;
      if(w>8 && h>8){
        region={x:Math.round(X0),y:Math.round(Y0),w:Math.round(w),h:Math.round(h)};
        syncRegion(`检测区域：x=${region.x},y=${region.y},宽=${region.w},高=${region.h}，可拖动/改数值微调`);
      } else {
        log('框得太小，未取用');
      }
      sel=null;
    }
    edit.active=false;
    ui();
  }
  function syncRegion(msg){
    updateRegionInputs();
    $('regionEdit').style.display='flex';
    if(msg) log(msg);
  }
  function updateRegionInputs(){
    if(!region) return;
    $('regX').value=region.x; $('regY').value=region.y;
    $('regW').value=region.w; $('regH').value=region.h;
  }
  $('btnApplyRegion').onclick=()=>{
    if(!region) return;
    let x=parseInt($('regX').value)||0, y=parseInt($('regY').value)||0;
    let w=parseInt($('regW').value)||8, h=parseInt($('regH').value)||8;
    x=Math.max(0,Math.min(srcW()-w,x)); y=Math.max(0,Math.min(srcH()-h,y));
    w=Math.max(8,Math.min(srcW()-x,w)); h=Math.max(8,Math.min(srcH()-y,h));
    region={x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)};
    updateRegionInputs();
    log('已应用区域：x='+region.x+',y='+region.y+',宽='+region.w+',高='+region.h);
  };

  pv.addEventListener('mousedown', pointerDown);
  document.addEventListener('mousemove', pointerMove);
  document.addEventListener('mouseup', pointerUp);

  btnRegion.onclick = ()=>{
    if(!stream) return;
    selectArmed=true;
    $('pvhint').textContent='在画面上按住鼠标左键拖拽以框选检测区域，松开确认';
  };
  btnClear.onclick=()=>{ region=null; $('regionEdit').style.display='none'; log('重置为全屏检测'); ui(); };

  // ---------- 图像处理 ----------
  const off=document.createElement('canvas'), offctx=off.getContext('2d');
  const small=document.createElement('canvas'), sctx=small.getContext('2d');
  function grabFrame(){
    const r = region || {x:0,y:0,w:video.videoWidth,h:video.videoHeight};
    off.width=r.w; off.height=r.h;
    offctx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
    small.width=COMPARE_W; small.height=COMPARE_H;
    sctx.drawImage(off, 0,0, COMPARE_W, COMPARE_H);
    const data=sctx.getImageData(0,0,COMPARE_W,COMPARE_H).data;
    const gray=new Uint8Array(COMPARE_W*COMPARE_H);
    for(let i=0,k=0;i<data.length;i+=4,k++) gray[k]=(data[i]+data[i+1]+data[i+2])/3|0;
    return {gray, dataURL: off.toDataURL('image/png'), w: off.width, h: off.height};
  }
  function diff(a,b){ let s=0; for(let i=0;i<a.length;i++) s+=Math.abs(a[i]-b[i]); return s/a.length; }
  function isDup(gray){ for(const s of savedSigs){ if(diff(gray,s) < parseFloat($('dth').value)) return true; } return false; }

  // ---------- 3. 开始 / 暂停 / 停止 ----------
  btnStart.onclick = ()=>{ if(!stream)return; prepStart(); };
  function prepStart(){
    running=true; paused=false; prevGray=null; timer=setInterval(tick, parseFloat($('interval').value)*1000);
    btnStart.disabled=true; btnStop.disabled=false; btnPause.disabled=false; btnPause.textContent='⏸ 暂停';
    ui(); log('开始检测区域变化…');
  }
  btnPause.onclick = ()=>{
    if(!running)return;
    paused=!paused;
    if(paused){ prevGray=null; clearInterval(timer); btnPause.textContent='▶ 继续'; }
    else { prevGray=null; timer=setInterval(tick, parseFloat($('interval').value)*1000); btnPause.textContent='⏸ 暂停'; }
    ui();
  };
  btnStop.onclick = ()=>{ doStop(); if($('ckAuto').checked) downloadPpt(); };
  function doStop(){
    running=false; paused=false;
    if(timer){ clearInterval(timer); timer=null; }
    btnStart.disabled=false; btnStop.disabled=true; btnPause.disabled=true; btnPause.textContent='⏸ 暂停';
    ui(); log('已停止。点击“下载 PPT”保存为 .pptx');
  }
  function resetAll(){
    doStop();
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    btnRegion.disabled=true; btnClear.disabled=true; btnStart.disabled=true; btnDown.disabled=true;
    $('pvhint').textContent='尚未选择屏幕'; bbox.style.display='none'; ui();
  }

  function tick(){
    if(!running || paused) return;
    let fr;
    try{ fr=grabFrame(); }catch(e){ log('取帧失败: '+e.message); return; }
    const cth=parseFloat($('cth').value);
    let score=0;
    if(prevGray) score=diff(fr.gray, prevGray);
    const isFirst = prevGray===null;
    if(isFirst || score>=cth){
      if(!isFirst && isDup(fr.gray)){
        dupCount++; log('第 '+captureCount+' 次候选与已保存页相同，去重跳过（差异 '+score.toFixed(1)+'）');
      }else{
        captureCount++;
        savedImages.push({data: fr.dataURL, w: fr.w, h: fr.h});
        savedSigs.push(fr.gray.slice());
        log('捕获画面变化（差异 '+score.toFixed(1)+'），当前 '+savedImages.length+' 页');
      }
    }
    prevGray=fr.gray.slice();
    ui();
  }

  // ---------- 4. 下载 PPT ----------
  function downloadPpt(){
    if(savedImages.length===0){ alert('还没有捕获到画面，无法生成PPT'); return; }
    log('正在生成 PPT（'+savedImages.length+' 页）…');
    try{
      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_WIDE';   // PPT 工作区：13.333 x 7.5 英寸（16:9 宽屏），与下方 W/H 匹配
      const W=13.333, H=7.5;
      savedImages.forEach(img=>{
        const slide=pptx.addSlide();
        const iw=img.w||W, ih=img.h||H;
        // 等比缩放，让图片完整放入工作区内（绝不超出），并水平垂直居中
        const ratio=Math.min(W/iw, H/ih);
        const w=iw*ratio, h=ih*ratio;
        slide.addImage({ data:img.data, x:(W-w)/2, y:(H-h)/2, w, h });
      });
      pptx.writeFile({ fileName:'screenshots.pptx' });
      log('PPT 已生成并开始下载：screenshots.pptx（共 '+savedImages.length+' 页，已适配工作区不溢出）');
    }catch(e){ log('生成PPT失败: '+e.message); }
  }
  btnDown.onclick=downloadPpt;

  ui();

  // 窗口尺寸变化时重算预览区域框
  window.addEventListener('resize', ()=>{ if(stream) fitPreview(); });
})();
</script>
</body>
</html>
